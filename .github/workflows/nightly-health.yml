name: Nightly Health & Dependency Check

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  health:
    name: Toolchain & Dependency Sanity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Verify CLI Tools Availability
        run: |
          echo "Checking Trellis CLI latest release..."
          npm view @mindfoldhq/trellis version || true

          echo "Checking Graphify latest release..."
          npm view graphifyy version 2>/dev/null || true

          echo "Checking agent-lsp latest release..."
          curl -fsSL https://api.github.com/repos/blackwell-systems/agent-lsp/releases/latest | grep '"tag_name"' || true

      - name: Verify Verification Runner Self-Check
        run: |
          python3 .trellis/scripts/verify.py --dry-run
