name: Pull Request Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Sanity & Branch Policy Gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Branch Convention
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Inspecting PR head branch: $BRANCH"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "Error: Pull requests directly from 'main' or 'master' are disallowed. Use a feature branch or worktree (task/*, feat/*, fix/*)." >&2
            exit 1
          fi

      - name: Validate No Leaked Worktree Artifacts
        run: |
          if [ -d ".trellis/worktrees" ]; then
            echo "Error: .trellis/worktrees/ directory should never be tracked or committed to git." >&2
            exit 1
          fi

      - name: Validate Task Branch Metadata
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          from pathlib import Path

          tasks_dir = Path(".trellis/tasks")
          if not tasks_dir.is_dir():
              sys.exit(0)

          for task_json in tasks_dir.glob("*/task.json"):
              try:
                  data = json.loads(task_json.read_text(encoding="utf-8"))
                  branch = data.get("branch")
                  base = data.get("base_branch")
                  if branch and base and branch == base and branch == "main":
                      print(f"Warning: {task_json} has both branch and base_branch set to 'main'. Work should be on a feature/task branch.")
              except Exception as e:
                  print(f"Error parsing {task_json}: {e}", file=sys.stderr)
                  sys.exit(1)
          PYEOF

      - name: Validate Trellis Task Schema
        run: |
          python3 .trellis/scripts/task.py validate
